name: PIEQ distributed evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/pieq/**"
      - ".github/workflows/pieq-evaluation.yml"

permissions:
  contents: read

jobs:
  etcd-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: research/pieq
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install evaluation test dependencies
        run: python -m pip install -r requirements-eval.txt
      - name: Start isolated, digest-pinned three-member etcd cluster
        run: docker compose -f containers/etcd-compose.yml up -d
      - name: Run Python regressions and container-backed fault schedules
        env:
          PIEQ_ETCD_COMPOSE: ${{ github.workspace }}/research/pieq/containers/etcd-compose.yml
          PIEQ_ETCD_ENDPOINTS: http://127.0.0.1:12379,http://127.0.0.1:22379,http://127.0.0.1:32379
        run: python -m pytest tests/ -q
      - name: Archive full distributed fault receipts
        env:
          PIEQ_ETCD_COMPOSE: ${{ github.workspace }}/research/pieq/containers/etcd-compose.yml
          PIEQ_ETCD_ENDPOINTS: http://127.0.0.1:12379,http://127.0.0.1:22379,http://127.0.0.1:32379
        run: python scripts/run_etcd_fault_eval.py --repetitions 20 --output results/ci_etcd_evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pieq-etcd-evidence
          path: research/pieq/results/ci_etcd_evidence.json
          if-no-files-found: warn
      - name: Stop isolated cluster
        if: always()
        run: docker compose -f containers/etcd-compose.yml down

  rev12-stress-and-pg-e2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zalando
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: research/pieq
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install evaluation test dependencies + psycopg2-binary
        run: python -m pip install -r requirements-eval.txt psycopg2-binary
      - name: Run Rev 12 synthesis, scalability, and multi-process Section 5 suites
        run: |
          python scripts/run_rev12_synthesis_vs_completion.py
          python scripts/run_rev12_scalability_stress.py
          python scripts/run_rev12_section5_fault_eval.py
      - name: Run real PostgreSQL 16 Tier E2 contract + Rev 12 concurrent/revocation races
        run: |
          python experiments/pg_patroni_failover/rev11_exp08_e2_adapter.py 127.0.0.1 --include-rev12-races > results/rev12/ci_pg16_e2_races.json
          cat results/rev12/ci_pg16_e2_races.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pieq-rev12-evidence
          path: research/pieq/results/rev12/
          if-no-files-found: warn
