name: pieq-etcd-evaluation
x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.7.3@sha256:0d27b9478551f431f82d1e0ddb6c87ad07ebae8b904c637f3a99213349523910
  entrypoint: /usr/local/bin/etcd
  environment:
    ETCD_INITIAL_CLUSTER: pieq0=http://etcd0:2380,pieq1=http://etcd1:2380,pieq2=http://etcd2:2380
    ETCD_INITIAL_CLUSTER_TOKEN: pieq-isolated-evaluation-v1
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
services:
  etcd0:
    <<: *etcd
    command: [--name,pieq0,--data-dir,/tmp/etcd,--advertise-client-urls,http://etcd0:2379,--initial-advertise-peer-urls,http://etcd0:2380]
    ports: ["127.0.0.1:12379:2379"]
  etcd1:
    <<: *etcd
    command: [--name,pieq1,--data-dir,/tmp/etcd,--advertise-client-urls,http://etcd1:2379,--initial-advertise-peer-urls,http://etcd1:2380]
    ports: ["127.0.0.1:22379:2379"]
  etcd2:
    <<: *etcd
    command: [--name,pieq2,--data-dir,/tmp/etcd,--advertise-client-urls,http://etcd2:2379,--initial-advertise-peer-urls,http://etcd2:2380]
    ports: ["127.0.0.1:32379:2379"]
