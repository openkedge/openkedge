# =============================================================================
# PIEQ Section 6.3 / Revision 7 P2 — Isolated 3-Node PostgreSQL/Patroni +
# 3-Member etcd Quorum Experimental Testbed
#
# STATUS: UNEXECUTED (Docker/Patroni/etcd runtime unavailable on authoring host).
# Deploy ONLY in an isolated disposable test environment.
# =============================================================================
version: "3.9"

networks:
  pieq_db_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  pieq_oob_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

services:
  etcd1:
    image: quay.io/coreos/etcd:v3.7.3
    container_name: pieq-etcd1
    command:
      - etcd
      - --name=etcd1
      - --initial-advertise-peer-urls=http://172.28.0.11:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://172.28.0.11:2379
      - --initial-cluster-token=pieq-etcd-cluster-1
      - --initial-cluster=etcd1=http://172.28.0.11:2380,etcd2=http://172.28.0.12:2380,etcd3=http://172.28.0.13:2380
      - --initial-cluster-state=new
      - --enable-v2=false
    networks:
      pieq_db_net:
        ipv4_address: 172.28.0.11

  etcd2:
    image: quay.io/coreos/etcd:v3.7.3
    container_name: pieq-etcd2
    command:
      - etcd
      - --name=etcd2
      - --initial-advertise-peer-urls=http://172.28.0.12:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://172.28.0.12:2379
      - --initial-cluster-token=pieq-etcd-cluster-1
      - --initial-cluster=etcd1=http://172.28.0.11:2380,etcd2=http://172.28.0.12:2380,etcd3=http://172.28.0.13:2380
      - --initial-cluster-state=new
      - --enable-v2=false
    networks:
      pieq_db_net:
        ipv4_address: 172.28.0.12

  etcd3:
    image: quay.io/coreos/etcd:v3.7.3
    container_name: pieq-etcd3
    command:
      - etcd
      - --name=etcd3
      - --initial-advertise-peer-urls=http://172.28.0.13:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://172.28.0.13:2379
      - --initial-cluster-token=pieq-etcd-cluster-1
      - --initial-cluster=etcd1=http://172.28.0.11:2380,etcd2=http://172.28.0.12:2380,etcd3=http://172.28.0.13:2380
      - --initial-cluster-state=new
      - --enable-v2=false
    networks:
      pieq_db_net:
        ipv4_address: 172.28.0.13

  pg1:
    image: ghcr.io/zalando/spilo-16:3.3-p1
    container_name: pieq-pg1
    cap_add: ["NET_ADMIN"]
    environment:
      PATRONI_NAME: pg1
      PATRONI_SCOPE: pieq_pg_cluster
      PATRONI_ETCD3_HOSTS: "172.28.0.11:2379,172.28.0.12:2379,172.28.0.13:2379"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "172.28.0.21:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "172.28.0.21:5432"
    volumes:
      - ./patroni_node.yml:/etc/patroni/patroni.yml:ro
    depends_on: [etcd1, etcd2, etcd3]
    networks:
      pieq_db_net:
        ipv4_address: 172.28.0.21
      pieq_oob_net:
        ipv4_address: 172.29.0.21

  pg2:
    image: ghcr.io/zalando/spilo-16:3.3-p1
    container_name: pieq-pg2
    cap_add: ["NET_ADMIN"]
    environment:
      PATRONI_NAME: pg2
      PATRONI_SCOPE: pieq_pg_cluster
      PATRONI_ETCD3_HOSTS: "172.28.0.11:2379,172.28.0.12:2379,172.28.0.13:2379"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "172.28.0.22:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "172.28.0.22:5432"
    volumes:
      - ./patroni_node.yml:/etc/patroni/patroni.yml:ro
    depends_on: [etcd1, etcd2, etcd3]
    networks:
      pieq_db_net:
        ipv4_address: 172.28.0.22
      pieq_oob_net:
        ipv4_address: 172.29.0.22

  pg3:
    image: ghcr.io/zalando/spilo-16:3.3-p1
    container_name: pieq-pg3
    cap_add: ["NET_ADMIN"]
    environment:
      PATRONI_NAME: pg3
      PATRONI_SCOPE: pieq_pg_cluster
      PATRONI_ETCD3_HOSTS: "172.28.0.11:2379,172.28.0.12:2379,172.28.0.13:2379"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "172.28.0.23:8008"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "172.28.0.23:5432"
    volumes:
      - ./patroni_node.yml:/etc/patroni/patroni.yml:ro
    depends_on: [etcd1, etcd2, etcd3]
    networks:
      pieq_db_net:
        ipv4_address: 172.28.0.23
      pieq_oob_net:
        ipv4_address: 172.29.0.23
